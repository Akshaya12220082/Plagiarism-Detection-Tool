<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PLAGIARISM DETECTION</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap + fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="hero text-center">
    <h1 class="display-heading">PLAGIARISM DETECTION</h1>
    <p class="tagline">Classical DSA based detection — KMP · Rabin-Karp · LCS · Edit Distance</p>
  </header>

  <main class="container py-4">
  {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-warning">
      {% for m in messages %} {{ m }} <br> {% endfor %}
    </div>
  {% endif %}
  {% endwith %}

  <div class="card p-4 shadow-lg">
    <h5 class="card-title text-center mb-3">Paste Text or Upload a File</h5>

    <form id="mainForm" action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data">
      <textarea id="input_text" name="input_text" class="form-control mb-3" rows="8" placeholder="Paste or type text here..."></textarea>

      <label class="form-label small">Or upload a file</label>
      <input class="form-control mb-3" type="file" name="file" id="file" accept=".txt,.docx,.pdf,.pptx" />

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-lg btn-primary px-5">Analyze</button>
      </div>
    </form>
  </div>
</main>
